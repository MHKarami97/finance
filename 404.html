<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>صفحه پیدا نشد</title>
  <style>
    body {
      margin: 0;
      font-family: system-ui, -apple-system, sans-serif;
      background-color: #FAFAFA;
      color: #171717;
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
      text-align: center;
      direction: rtl;
    }
    .container {
      padding: 2rem;
    }
    h1 {
      font-size: 3rem;
      margin: 0 0 1rem;
      color: #D946EF;
    }
    p {
      color: #737373;
      margin-bottom: 2rem;
    }
    a {
      background-color: #D946EF;
      color: white;
      text-decoration: none;
      padding: 0.75rem 2rem;
      border-radius: 1rem;
      font-weight: bold;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>مسیر اشتباه</h1>
    <p>ظاهرا به آدرس اشتباهی در سرور مراجعه کرده‌اید.</p>
    <!-- Redirect to SPA base hash -->
    <a href="/">بازگشت به اپلیکیشن</a>
  </div>
</body>
</html>
